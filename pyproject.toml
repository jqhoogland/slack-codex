[project]
name = "slack-codex"
version = "0.1.0"
description = "Local Slack reaction workflows for Codex"
requires-python = ">=3.11"
dependencies = ["keyring>=25,<26"]

[project.scripts]
slack-codex = "slack_codex:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["slack_codex.py"]
