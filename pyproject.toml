[project]
name = "slack-codex"
version = "0.1.0"
description = "Local Slack reaction workflows for Codex"
requires-python = ">=3.11"
dependencies = [
    "keyring>=25,<26",
    "slack-sdk>=3.33,<4",
]

[project.scripts]
slack-codex = "slack_codex:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["slack_codex.py", "event_worker.py", "codex_rpc.py", "linear_sync.py", "chat_archive.py"]
